<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Love Flowers</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #F8F3ED;
            --card: #FFFFFF;
            --text-main: #2C1E16; 
            --text-muted: #8A7363;
            --accent: #9B1C31; 
            --accent-light: #F9EBEC;
            --border: #EAE0D5;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0,0,0,0.015) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0,0,0,0.02) 0%, transparent 40%),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            color: var(--text-main);
            margin: 0;
            padding: 0 16px;
            padding-bottom: 110px;
        }

        .header {
            text-align: center;
            padding: 30px 0 20px;
            position: sticky;
            top: 0;
            background: rgba(248, 243, 237, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 50;
            border-bottom: 1px solid rgba(234, 224, 213, 0.5);
            margin-bottom: 16px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 34px;
            font-weight: 700;
            margin: 0;
            color: var(--accent);
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 4px 0 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .nav {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        .nav::-webkit-scrollbar { display: none; }

        .nav-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .nav-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(155, 28, 49, 0.25);
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 
                0 12px 28px rgba(44, 30, 22, 0.08), 
                0 4px 10px rgba(44, 30, 22, 0.04);
            display: flex;
            flex-direction: column;
            animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 200px; 
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .card-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-price {
            font-weight: 600;
            font-size: 18px;
            color: var(--accent);
        }

        .add-btn {
            background: var(--accent-light);
            color: var(--accent);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(155, 28, 49, 0.15);
            position: relative;
            overflow: hidden; 
        }

        .add-btn:active {
            background: var(--accent);
            color: white;
            transform: scale(0.95);
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px)) 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            box-shadow: 0 -10px 30px rgba(44, 30, 22, 0.08);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            z-index: 100;
        }

        .total-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .total-val {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .checkout-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(155, 28, 49, 0.3);
            transition: transform 0.1s;
        }

        .checkout-btn:active {
            transform: scale(0.95);
        }

        .checkout-btn:disabled {
            background: #ccc;
            box-shadow: none;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .heart-burst {
            position: fixed;
            font-size: 20px;
            pointer-events: none;
            z-index: 9999;
            animation: heartFloat 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes heartFloat {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -80%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(0.8); }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(155, 28, 49, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Fleur</h1>
        <p>Цветы, говорящие за вас</p>
    </div>

    <div class="nav" id="nav-container"></div>
    <div class="menu" id="menu-container"></div>

    <div class="bottom-bar">
        <div>
            <div class="total-label">Сумма заказа</div>
            <div class="total-val"><span id="total">0</span> сум</div>
        </div>
        <button class="checkout-btn" id="checkout-btn" onclick="sendOrder()">Оформить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp; 
        tg.expand();
        tg.enableClosingConfirmation();

        const products = [
            { id: 1, cat: "bouquets", name: "101 Роза", price: 1200000, desc: "Бесконечная любовь в каждом лепестке", img: "https://images.unsplash.com/photo-1561181286-d3fee7d55364?q=80&w=400" },
            { id: 2, cat: "bouquets", name: "Пионы «Розовый закат»", price: 320000, desc: "Нежность и весеннее настроение", img: "https://images.unsplash.com/photo-1591887000678-7d8286091e6b?q=80&w=400" },
            { id: 3, cat: "bouquets", name: "Белые розы с эвкалиптом", price: 450000, desc: "Элегантность и свежесть", img: "https://images.unsplash.com/photo-1533616688419-b7a585564566?q=80&w=400" },
            { id: 4, cat: "bouquets", name: "Летний микс", price: 280000, desc: "Яркие эмоции и полевые цветы", img: "https://images.unsplash.com/photo-1563241527-3004b7be0ffd?q=80&w=400" },
            { id: 5, cat: "bouquets", name: "Подсолнухи", price: 350000, desc: "Солнечное настроение в доме", img: "https://images.unsplash.com/photo-1597848212624-a19eb35e2651?q=80&w=400" },
            { id: 6, cat: "gifts", name: "Мишка + 15 Роз", price: 550000, desc: "Идеальный сюрприз для любимой", img: "https://images.unsplash.com/photo-1520763185298-1b434c919102?q=80&w=400" },
            { id: 7, cat: "gifts", name: "Коробка конфет", price: 180000, desc: "Сладкий комплимент к букету", img: "https://images.unsplash.com/photo-1548907040-4baa42d10919?q=80&w=400" },
            { id: 8, cat: "gifts", name: "Открытка + Роза", price: 65000, desc: "Маленький, но важный жест", img: "https://images.unsplash.com/photo-1587314168485-3236d6710814?q=80&w=400" },
            { id: 9, cat: "gifts", name: "Воздушные шары", price: 150000, desc: "Сердца с гелием", img: "https://images.unsplash.com/photo-1530103862676-de8c9debad1d?q=80&w=400" },
            { id: 10, cat: "single", name: "Эквадорская роза", price: 45000, desc: "Один, но идеальный цветок", img: "https://images.unsplash.com/photo-1496062031456-07b8f162a322?q=80&w=400" },
            { id: 11, cat: "single", name: "Тюльпан", price: 15000, desc: "Классика весеннего настроения", img: "https://images.unsplash.com/photo-1586969336621-4f4132b7ccbf?q=80&w=400" },
            { id: 12, cat: "single", name: "Ромашка", price: 10000, desc: "Просто и со вкусом", img: "https://images.unsplash.com/photo-1595514214496-55c6f45540b1?q=80&w=400" },
            { id: 13, cat: "single", name: "Гербера", price: 25000, desc: "Яркий акцент в любом букете", img: "https://images.unsplash.com/photo-1596622050068-299e5b54a54c?q=80&w=400" }
        ];

        const categories = [
            { id: "bouquets", title: "Букеты" }, 
            { id: "gifts", title: "Подарки" }, 
            { id: "single", title: "Поштучно" }
        ];

        let cart = {}, currentCategory = "bouquets", isSending = false;
        let currentTotalValue = 0; // Для анимации кассы

        const nav = document.getElementById('nav-container');
        categories.forEach(cat => {
            const btn = document.createElement('button'); 
            btn.className = `nav-btn ${cat.id === currentCategory ? 'active' : ''}`; 
            btn.innerText = cat.title;
            btn.onclick = () => { 
                if(currentCategory === cat.id) return; 
                currentCategory = cat.id; 
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); 
                btn.classList.add('active'); 
                render(); 
            };
            nav.appendChild(btn);
        });

        const container = document.getElementById('menu-container');
        function render() {
            container.innerHTML = '';
            const filtered = products.filter(p => p.cat === currentCategory);
            
            filtered.forEach((p, i) => {
                const div = document.createElement('div'); 
                div.className = 'card'; 
                div.style.animationDelay = `${i * 0.08}s`;
                
                div.innerHTML = `
                    <img src="${p.img}" class="card-img" alt="${p.name}" loading="lazy" onerror="this.src='https://placehold.co/400x200/eee/999?text=no+photo'">
                    <div class="card-info">
                        <div class="card-title">${p.name}</div>
                        <div class="card-desc">${p.desc}</div>
                        <div class="card-bottom">
                            <div class="card-price">${p.price.toLocaleString()} сум</div>
                            <button class="add-btn" id="btn-${p.id}" onclick="add(event, ${p.id}, '${p.name}', ${p.price})">+</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }
        render();

        function add(event, id, name, price) {
            if(isSending) return; 
            
            if(!cart[id]) cart[id] = { name, price, qty: 1 }; 
            else cart[id].qty++; 
            
            tg.HapticFeedback.impactOccurred('light'); 
            
            createRipple(event);
            createHeart(event);
            
            updateTotal();
        }

        function createRipple(event) {
            const button = event.currentTarget;
            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - button.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${event.clientY - button.getBoundingClientRect().top - radius}px`;
            circle.classList.add("ripple");
            
            const ripple = button.getElementsByClassName("ripple")[0];
            if (ripple) { ripple.remove(); }
            button.appendChild(circle);
        }

        function createHeart(event) {
            const btn = event.currentTarget;
            const rect = btn.getBoundingClientRect();
            const heart = document.createElement('div');
            heart.className = 'heart-burst';
            heart.innerText = '❤️'; 
            heart.style.left = `${rect.left + rect.width / 2}px`;
            heart.style.top = `${rect.top}px`;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 800);
        }

        // --- ВОЗВРАЩАЕМ ЭФФЕКТ КАССЫ ---
        function updateTotal() {
            let targetTotal = 0, count = 0; 
            for(let id in cart) { 
                targetTotal += cart[id].price * cart[id].qty; 
                count += cart[id].qty; 
            }
            
            // Запускаем анимацию цифр
            animateValue("total", currentTotalValue, targetTotal, 400);
            currentTotalValue = targetTotal;

            const btn = document.getElementById('checkout-btn');
            btn.innerText = count > 0 ? `Оформить (${count})` : 'Оформить';
        }

        // Функция плавного изменения чисел
        function animateValue(id, start, end, duration) {
            if (start === end) return;
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 4); 
                const current = Math.floor(easeProgress * (end - start) + start);
                obj.innerText = current.toLocaleString();
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        function sendOrder() {
            if(isSending || Object.keys(cart).length === 0) { 
                tg.showAlert("Ваша корзина пуста 🌸"); 
                return; 
            }
            
            isSending = true; 
            const btn = document.getElementById('checkout-btn'); 
            btn.innerText = 'Отправка...'; 
            btn.disabled = true;
            
            let arr = []; 
            for(let id in cart) {
                arr.push({ name: cart[id].name, qty: cart[id].qty, price: cart[id].price });
            }
            
            tg.sendData(JSON.stringify({ action: "new_order", items: arr })); 
            setTimeout(() => tg.close(), 500);
        }
    </script>
</body>
</html>
